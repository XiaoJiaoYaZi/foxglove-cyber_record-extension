[package]
name = "cyberrecord"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Apollo Cyber RT record reader and Foxglove data loader"
repository = "https://github.com/liqiudong/foxglove-cyberrecord"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0"

# The Foxglove host bindings are only needed for the WebAssembly data loader.
# Keeping them target-specific also lets the parser be tested on the host.
[target.'cfg(target_arch = "wasm32")'.dependencies]
foxglove = { version = "0.30.2", default-features = false }
foxglove_data_loader = "0.2.1"

[dev-dependencies]
prost = "0.14"
prost-types = "0.14"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
