name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - run: npm ci

      - name: Verify tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node -e "const p=require('./package.json'); if ('v'+p.version !== process.env.TAG) { console.error('Tag', process.env.TAG, 'does not match package.json version', p.version); process.exit(1); }"

      - name: Build package
        run: npm run package

      - name: Write checksum
        run: |
          sha256sum ./*.foxe | tee SHA256SUMS.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" ./*.foxe SHA256SUMS.txt \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
